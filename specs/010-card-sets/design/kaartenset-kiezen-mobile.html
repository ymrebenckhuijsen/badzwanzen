<style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
            -webkit-tap-highlight-color: transparent;
        }

        .tactile-button {
            box-shadow: 0 6px 0 0 #005321;
            transition: all 0.1s ease;
        }

        .tactile-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 #005321;
        }

        .grainy-bg {
            background-image: url("https://www.transparenttextures.com/patterns/p6.png");
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #434655;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md overflow-hidden flex flex-col h-screen">
<!-- TopAppBar -->
<header class="bg-surface/80 backdrop-blur-md flex justify-between items-center px-container-margin py-base w-full fixed top-0 z-50 flat no shadows">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-black text-secondary tracking-tighter">PARTY PULSE</h1>
<div class="flex items-center gap-sm">
<button class="hover:scale-105 transition-transform active:scale-95 transition-all text-primary">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 mt-[60px] mb-[100px] overflow-y-auto px-container-margin grainy-bg flex justify-center">
<div class="w-full max-w-[500px] py-lg flex flex-col gap-lg">
<!-- Header Section -->
<section class="flex flex-col gap-xs">
<h2 class="font-display-xl text-display-xl text-primary drop-shadow-lg">Kaartenset</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Kies welke set kaarten deze sessie gebruikt.</p>
</section>
<!-- Set List -->
<section class="flex flex-col gap-sm custom-scroll">
<!-- Set Card 1: Seed testset (selected/default) -->
<button class="w-full text-left bg-surface-container-high border-2 border-primary rounded-xl p-md flex justify-between items-center shadow-[0px_4px_12px_rgba(0,0,0,0.2)]">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" data-icon="science">science</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Seed testset</span>
<span class="font-label-bold text-label-bold text-on-surface-variant tracking-wide">Voorbeeldkaarten &middot; 92 kaarten</span>
</div>
</div>
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Set Card 2: Vrienden editie -->
<button class="w-full text-left bg-surface-container-low border border-outline-variant rounded-xl p-md flex justify-between items-center shadow-[0px_4px_12px_rgba(0,0,0,0.15)]">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Vrienden editie</span>
<span class="font-label-bold text-label-bold text-on-surface-variant tracking-wide">140 kaarten</span>
</div>
</div>
<span class="material-symbols-outlined text-outline text-[28px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
<!-- Set Card 3: Werkborrel editie -->
<button class="w-full text-left bg-surface-container-low border border-outline-variant rounded-xl p-md flex justify-between items-center shadow-[0px_4px_12px_rgba(0,0,0,0.15)]">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container">
<span class="material-symbols-outlined" data-icon="work">work</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Werkborrel editie</span>
<span class="font-label-bold text-label-bold text-on-surface-variant tracking-wide">118 kaarten</span>
</div>
</div>
<span class="material-symbols-outlined text-outline text-[28px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</button>
</section>
<!-- Helper note -->
<p class="font-label-bold text-label-bold text-on-surface-variant tracking-wide flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="info">info</span>
De seed testset is altijd beschikbaar, ook als er nog geen echte sets zijn toegevoegd.
</p>
<!-- CTA Section -->
<section class="mt-base">
<button class="tactile-button w-full bg-secondary-container text-on-secondary-container py-md rounded-xl font-headline-lg flex items-center justify-center gap-base active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    START SPEL
                </button>
</section>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-surface-container-low/90 backdrop-blur-xl border-t-0 shadow-[0px_-10px_30px_rgba(0,0,0,0.3)] rounded-t-lg">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-bright/20 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="sports_esports" style="font-variation-settings: 'FILL' 1;">sports_esports</span>
<span class="font-label-bold text-label-bold">Play</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-2 hover:bg-surface-bright/20 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="style" style="font-variation-settings: 'FILL' 1;">style</span>
<span class="font-label-bold text-label-bold">Sets</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-bright/20 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-label-bold text-label-bold">Rules</span>
</a>
</nav>
<script>
        // Selection interaction: tap a set card to select it
        const setCards = document.querySelectorAll('main section:nth-of-type(1) button');
        setCards.forEach((card) => {
            card.addEventListener('click', () => {
                setCards.forEach((c) => {
                    c.classList.remove('bg-surface-container-high', 'border-primary');
                    c.classList.add('bg-surface-container-low', 'border-outline-variant');
                    const icon = c.querySelector('[data-icon="check_circle"], [data-icon="radio_button_unchecked"]');
                    if (icon) {
                        icon.setAttribute('data-icon', 'radio_button_unchecked');
                        icon.textContent = 'radio_button_unchecked';
                        icon.classList.remove('text-primary');
                        icon.classList.add('text-outline');
                    }
                });
                card.classList.remove('bg-surface-container-low', 'border-outline-variant');
                card.classList.add('bg-surface-container-high', 'border-primary');
                const icon = card.querySelector('[data-icon="check_circle"], [data-icon="radio_button_unchecked"]');
                if (icon) {
                    icon.setAttribute('data-icon', 'check_circle');
                    icon.textContent = 'check_circle';
                    icon.classList.remove('text-outline');
                    icon.classList.add('text-primary');
                }
                console.log('Kaartenset geselecteerd:', card.querySelector('span.font-body-lg').textContent);
            });
        });

        const startBtn = document.querySelector('.tactile-button.bg-secondary-container');
        if (startBtn) {
            startBtn.addEventListener('click', () => {
                startBtn.classList.add('scale-95');
                setTimeout(() => startBtn.classList.remove('scale-95'), 100);
                console.log('Spel start!');
            });
        }
    </script>
</body></html>
