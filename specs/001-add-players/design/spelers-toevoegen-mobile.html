<style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
            -webkit-tap-highlight-color: transparent;
        }
        
        .tactile-button {
            box-shadow: 0 6px 0 0 #005321;
            transition: all 0.1s ease;
        }
        
        .tactile-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 #005321;
        }

        .grainy-bg {
            background-image: url("https://www.transparenttextures.com/patterns/p6.png");

      min-height: max(884px, 100dvh);

<body class="font-body-md text-body-md overflow-hidden flex flex-col h-screen">
<!-- TopAppBar -->
<header class="bg-surface/80 backdrop-blur-md flex justify-between items-center px-container-margin py-base w-full fixed top-0 z-50 flat no shadows">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-black text-secondary tracking-tighter">PARTY PULSE</h1>
<div class="flex items-center gap-sm">
<button class="hover:scale-105 transition-transform active:scale-95 transition-all text-primary">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 mt-[60px] mb-[100px] overflow-y-auto px-container-margin grainy-bg flex justify-center">
<div class="w-full max-w-[500px] py-lg flex flex-col gap-lg">
<!-- Header Section -->
<section class="flex flex-col gap-xs">
<h2 class="font-display-xl text-display-xl text-primary drop-shadow-lg">Badzwanzen</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Wie durft er mee te doen?</p>
</section>
<!-- Input Section -->
<section class="flex flex-col gap-base">
<div class="flex gap-sm items-center">
<div class="relative flex-1">
<input class="w-full bg-surface-container-high border-2 border-primary rounded-xl px-md py-base font-body-lg text-body-lg focus:outline-none focus:ring-2 focus:ring-primary/50 text-on-surface placeholder:text-outline" placeholder="Naam invoeren..." type="text" value="Mila"/>
<div class="absolute -bottom-6 left-2 flex items-center gap-xs">
<span class="material-symbols-outlined text-error text-[16px]" data-icon="error">error</span>
<span class="text-[12px] font-label-bold text-error">Deze naam bestaat al!</span>
</div>
</div>
<button class="tactile-button bg-secondary text-on-secondary-fixed w-14 h-14 rounded-xl flex items-center justify-center active:scale-90 transition-all">
<span class="material-symbols-outlined font-black text-[32px]" data-icon="add">add</span>
</button>
</div>
<!-- Limit Indicator -->
<div class="flex justify-between items-center mt-md">
<span class="font-label-bold text-label-bold text-on-surface-variant tracking-widest uppercase">Spelers (3/20)</span>
<span class="font-label-bold text-label-bold text-secondary">Minimaal 2 nodig</span>
</div>
</section>
<!-- Player List -->
<section class="flex flex-col gap-sm custom-scroll">
<!-- Player Card 1 -->
<div class="bg-surface-container-low rounded-lg p-md flex justify-between items-center shadow-[0px_4px_12px_rgba(0,0,0,0.2)] border-l-4 border-secondary">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold">M</div>
<span class="font-body-lg text-body-lg text-on-surface">Mila</span>
</div>
<button class="text-outline hover:text-error transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Player Card 2 -->
<div class="bg-surface-container-low rounded-lg p-md flex justify-between items-center shadow-[0px_4px_12px_rgba(0,0,0,0.2)] border-l-4 border-tertiary">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container font-bold">J</div>
<span class="font-body-lg text-body-lg text-on-surface">Jasper</span>
</div>
<button class="text-outline hover:text-error transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Player Card 3 -->
<div class="bg-surface-container-low rounded-lg p-md flex justify-between items-center shadow-[0px_4px_12px_rgba(0,0,0,0.2)] border-l-4 border-primary">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-bold">T</div>
<span class="font-body-lg text-body-lg text-on-surface">Timo</span>
</div>
<button class="text-outline hover:text-error transition-colors active:scale-90">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</section>
<!-- Progress Bar Visualization -->
<div class="w-full bg-surface-container-highest h-3 rounded-full overflow-hidden">
<div class="bg-secondary h-full rounded-full w-[15%]"></div>
</div>
<!-- CTA Section -->
<section class="mt-base">
<button class="tactile-button w-full bg-secondary-container text-on-secondary-container py-md rounded-xl font-headline-lg flex items-center justify-center gap-base active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    START HET SPEL
                </button>
</section>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-surface-container-low/90 backdrop-blur-xl border-t-0 shadow-[0px_-10px_30px_rgba(0,0,0,0.3)] rounded-t-lg">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-bright/20 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="sports_esports">sports_esports</span>
<span class="font-label-bold text-label-bold">Play</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-2 hover:bg-surface-bright/20 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-bold text-label-bold">Players</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-bright/20 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-label-bold text-label-bold">Rules</span>
</a>
</nav>
<script>
        // Micro-interaction for the start button
        const startBtn = document.querySelector('.tactile-button.bg-secondary-container');
        if (startBtn) {
            startBtn.addEventListener('click', () => {
                startBtn.classList.add('scale-95');
                setTimeout(() => startBtn.classList.remove('scale-95'), 100);
                console.log('Spel start!');
            });
        }

        // Placeholder logic for adding players visually
        const addBtn = document.querySelector('.bg-secondary.tactile-button');
        const input = document.querySelector('input[type="text"]');
        
        if (addBtn && input) {
            addBtn.addEventListener('click', () => {
                if (input.value.trim() !== "") {
                    console.log('Player added:', input.value);
                    input.value = "";
                }
            });
        }
    </script>
