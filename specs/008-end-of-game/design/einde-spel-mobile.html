<script>
        // Simple confetti generation script for extra flair
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.relative.py-md');
            const colors = ['#b4c5ff', '#4ae176', '#ffb3ad', '#2563eb'];
            
            for (let i = 0; i < 15; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti absolute pointer-events-none opacity-40';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 6 + 4) + 'px';
                confetti.style.height = (Math.random() * 6 + 4) + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '2px' : '50%';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                // Add some float animation
                confetti.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 0.4 },
                    { transform: `translate(${Math.random() * 20 - 10}px, ${Math.random() * -30 - 20}px) rotate(${Math.random() * 180}deg)`, opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 3000,
                    iterations: Infinity,
                    direction: 'alternate',
                    easing: 'ease-in-out'
                });

                container.appendChild(confetti);
            }
        });
    </script>
